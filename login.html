<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMW — 로그인</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:#F8F7F4;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  .logo{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;color:#1a1a18}
  .sub{font-size:13px;color:#9e9d99;margin-bottom:32px}
  .label{font-size:12px;font-weight:600;color:#6b6b67;margin-bottom:6px;display:block}
  .input{width:100%;padding:10px 12px;border:1.5px solid rgba(0,0,0,.1);border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a18;outline:none;transition:border .15s;background:#fff}
  .input:focus{border-color:#1a1a18}
  .input-wrap{margin-bottom:16px}
  .btn{width:100%;padding:12px;border-radius:8px;background:#1a1a18;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:8px}
  .btn:hover{opacity:.85}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .error{font-size:12px;color:#dc2626;margin-top:12px;text-align:center;min-height:18px}
  .divider{border:none;border-top:1px solid rgba(0,0,0,.07);margin:24px 0}
  .footer{font-size:11px;color:#9e9d99;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">BMW</div>
  <div class="sub">Global SNS Calendar — 로그인이 필요한 서비스예요</div>

  <div class="input-wrap">
    <label class="label">이메일</label>
    <input class="input" id="email" type="email" placeholder="이메일 주소 입력" autocomplete="email"/>
  </div>
  <div class="input-wrap">
    <label class="label">비밀번호</label>
    <input class="input" id="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password"/>
  </div>

  <button class="btn" id="login-btn" onclick="handleLogin()">로그인</button>
  <div class="error" id="error-msg"></div>

  <hr class="divider">
  <div class="footer">접근 권한이 없으신가요? 관리자에게 문의해 주세요.</div>
</div>

<script>
const SUPABASE_URL = 'https://ahetdkarbdrmsuahawag.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qXPGvnM2PyP_-Dv1LKImvw_unm4vuKU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 이미 로그인된 경우 리다이렉트
(async()=>{
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    const role = session.user.user_metadata?.role;
    location.href = role === 'reviewer' ? '/review' : '/';
  }
})();

// 엔터키 로그인
document.addEventListener('keydown', e=>{ if(e.key==='Enter') handleLogin(); });

async function handleLogin(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('error-msg');

  errEl.textContent = '';

  if(!email || !password){
    errEl.textContent = '이메일과 비밀번호를 입력해주세요.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '로그인 중...';

  const {data, error} = await sb.auth.signInWithPassword({email, password});

  if(error){
    errEl.textContent = '이메일 또는 비밀번호가 올바르지 않아요.';
    btn.disabled = false;
    btn.textContent = '로그인';
    return;
  }

  // role에 따라 이동
  const role = data.user.user_metadata?.role;
  location.href = role === 'reviewer' ? '/review' : '/';
}
</script>
</body>
</html>
